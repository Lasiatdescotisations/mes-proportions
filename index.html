<!DOCTYPE html>
<html lang="fr">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f2f4f3">
<title>Mes proportions</title>

<link rel="apple-touch-icon" href="icon-192.png">

<style>
/* Carnet de cuisine : une colonne, gros chiffres tactiles, la quantité est le contrôle. */
:root{
  --bg:#f2f4f3; --surface:#ffffff; --ink:#1c2220; --muted:#5b6662;
  --line:#dce2df; --accent:#b0305a; --accent-soft:#f7e4ea; --on-accent:#ffffff;
  --danger:#b3261e;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121615; --surface:#1b201f; --ink:#edf1ef; --muted:#9ba7a2;
    --line:#2c3331; --accent:#ee7a9d; --accent-soft:#3b2029; --on-accent:#1b0f14; --danger:#ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121615; --surface:#1b201f; --ink:#edf1ef; --muted:#9ba7a2;
  --line:#2c3331; --accent:#ee7a9d; --accent-soft:#3b2029; --on-accent:#1b0f14; --danger:#ff8a80;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 48px}
h1,h2{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}

/* ---- liste ---- */
.top{padding:22px 0 14px;display:grid;gap:14px}
.toprow{display:flex;align-items:center;gap:10px}
.toprow h1{flex:1;font-size:30px;line-height:1.1}
.round{width:44px;height:44px;flex:none;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;cursor:pointer;color:var(--ink)}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:13px 0;outline:none;font-size:17px}
.search:focus-within{border-color:var(--accent)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.list a{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--surface);color:inherit;text-decoration:none;min-height:60px}
.list a:active{background:var(--accent-soft)}
.list .t{flex:1;min-width:0}
.list .n{font-weight:700;display:block}
.list .s{color:var(--muted);font-size:14px;display:flex;gap:6px;align-items:center;margin-top:2px}
.list .s svg{flex:none}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:2px}
.chev{color:var(--muted);flex:none}
.empty{color:var(--muted);padding:24px 4px;text-align:center}
.foot{color:var(--muted);font-size:14px;margin-top:16px;text-align:center}
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border-radius:14px;padding:12px 14px;font-size:15px}
.banner span{flex:1;min-width:160px}
.banner button,.banner a{border:0;background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer;color:var(--accent);text-decoration:none;font-size:15px}
.fab{position:fixed;right:max(16px, calc(50% - 264px));bottom:calc(18px + env(safe-area-inset-bottom));display:inline-flex;align-items:center;gap:8px;height:54px;padding:0 20px 0 16px;border-radius:999px;border:0;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:16px;box-shadow:0 6px 18px rgba(0,0,0,.18);cursor:pointer;text-decoration:none}
.has-fab{padding-bottom:96px}

/* ---- fiche ---- */
.bar{position:sticky;top:0;z-index:3;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;padding:8px 8px 8px 0;color:var(--accent);font-weight:700;cursor:pointer;text-decoration:none}
.bar .spacer{flex:1}
.bar .ttl{flex:1;text-align:center;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--muted);text-decoration:none;min-height:38px}
.iconbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.head{padding:18px 0 6px;display:grid;gap:10px}
.head h1{font-size:30px;line-height:1.1}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-weight:700;white-space:pre-line}
.note svg{flex:none;margin-top:2px;color:var(--accent)}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 10px;cursor:pointer;font-weight:700;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.panel{margin-top:14px;display:grid;gap:10px}
.label{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-width:48px;height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tools{display:flex;gap:8px;align-items:center}
.tools button{height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.tools button:disabled{opacity:.45;cursor:default}
.factor{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-size:15px}
.factor b{color:var(--accent)}
.ings{list-style:none;margin:16px 0 0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.ings li{display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;min-height:60px;border-top:1px solid var(--line)}
.ings li:first-child{border-top:0}
.ings .nm{flex:1;min-width:0}
.ings li.sec{min-height:0;padding:14px 16px 6px;background:var(--bg)}
.ings li.sec .label{color:var(--accent)}
.qty{width:116px;flex:none;text-align:right;font:700 24px/1 var(--display);font-variant-numeric:tabular-nums;border:1px solid transparent;background:var(--bg);border-radius:10px;padding:10px 12px;min-height:46px}
.qty:focus{outline:none;border-color:var(--accent);background:var(--accent-soft)}
.qty.edited{color:var(--accent)}
.static{width:116px;flex:none;text-align:right;padding:0 12px;font:700 20px/1.2 var(--display);font-variant-numeric:tabular-nums}
.none{width:116px;flex:none;text-align:right;padding:0 12px;color:var(--muted);font-size:15px}
.unit{font:400 15px var(--body);color:var(--muted);margin-left:3px}
.hint{color:var(--muted);font-size:14px;margin:12px 4px 0}

/* ---- éditeur ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding:0 8px;justify-content:flex-start;text-align:left}
.btn.danger{color:var(--danger)}
.btn.wide{width:100%}
.form{display:grid;gap:18px;padding-top:18px}
.field{display:grid;gap:6px}
.field > label,.field > .label-like{font-weight:700;font-size:15px}
.input,.select,.area{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;min-height:48px;outline:none}
.input:focus,.select:focus,.area:focus{border-color:var(--accent)}
.input.big{font:700 22px/1.2 var(--display)}
.area{resize:vertical;min-height:72px;line-height:1.4}
.help{color:var(--muted);font-size:14px;margin:0}
.errors{background:var(--accent-soft);border-left:4px solid var(--danger);border-radius:10px;padding:10px 14px;color:var(--ink)}
.errors p{margin:2px 0}
.rows{display:grid;gap:10px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;gap:8px}
.row .l1,.row .l2{display:flex;gap:8px;align-items:center}
.row .nameI{flex:1;min-width:0}
.row .qtyI{flex:1;min-width:0;font-variant-numeric:tabular-nums;font-weight:700}
.row .unitS{width:96px;flex:none;padding:12px 8px}
.row.secrow{background:var(--accent-soft);border-color:transparent}
.row.secrow .nameI{font-weight:700}
.mini{width:44px;height:44px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--bg);display:inline-grid;place-items:center;cursor:pointer;color:var(--muted)}
.mini:disabled{opacity:.35;cursor:default}
.mini.del{color:var(--danger)}
.addbar{display:flex;gap:8px;flex-wrap:wrap}
.addbar .btn{flex:1;min-width:140px}
details.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px}
details.box summary{cursor:pointer;font-weight:700;padding:14px 0;list-style:none;display:flex;align-items:center;justify-content:space-between}
details.box summary::-webkit-details-marker{display:none}
details.box summary::after{content:"+";font-size:22px;color:var(--muted);line-height:1}
details.box[open] summary::after{content:"–"}
details.box .in{display:grid;gap:12px;padding-bottom:14px}
.vbar{display:grid;gap:10px}
.dz{border-top:1px solid var(--line);padding-top:18px;display:grid;gap:10px}

/* ---- dialogues ---- */
.scrim{position:fixed;inset:0;background:rgba(10,14,13,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom));display:grid;gap:12px;max-height:88vh;overflow:auto}
.sheet h2{font-size:22px}
.sheet p{margin:0;color:var(--muted)}
.sheet .acts{display:grid;gap:8px}
@media (min-width:600px){.scrim{align-items:center}.sheet{border-radius:20px}}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>
</head>

,100],["Beurre",360]],"presets":{"i":0,"v":[2,5]}}]},{"id":"meringue-italienne","name":"Meringue italienne","variants":[{"ing":[["Eau",40],["Sucre",100],["Blancs",70],["Sucre",25]],"presets":{"i":2,"v":[35,70]}}]},{"id":"cookies","name":"Cookies","variants":[{"ing":[["Demi-sel",140],["Cassonade",135],["Sucre semoule",50],["Sucre vanillé",15],["T45",120],["T55",120],["Bicarbonate",null],["Oeuf",1],["Garniture",200]]}]},{"id":"brownie","name":"Brownie","note":"165° 27 min","variants":[{"ing":[["Chocolat",120],["Sucre semoule",200],["Pécan",50],["T45",90],["Beurre",90],["Œufs",2],["Bicarbonate/levure",null]]}]},{"id":"madeleines","name":"Madeleines","note":"180° 10 min","variants":[{"ing":[["Lait",50],["Sucre",120],["T45",150],["Beurre fondu",170],["Oeufs",2],["Jaune",1],["Levure",6],["Miel",null],["Zeste citron",null]]}]},{"id":"parfait-glace","name":"Parfait glacé","variants":[{"ing":[["Parfum",200],["Blancs",2],["Crème liquide",250],["Sucre semoule + sv",[40,80]]]}]},{"id":"nestle-parfait-chocolat","name":"Nestlé parfait chocolat (jaunes)","variants":[{"ing":[["Chocolat",170],["Jaunes",5],["Lait (cl)",20],["Sucre",150],["Crème liquide",150]],"presets":{"i":1,"v":[1,2,4,5]}}]},{"id":"sorbet-fruits-rouges","name":"Sorbet fruits rouges","variants":[{"ing":[["Fruits",450],["Sucre",157],["Eau",118]],"presets":{"i":0,"v":[133.5,450]}}]},{"id":"glace-chocolat-marmiton","name":"Glace chocolat marmiton","variants":[{"label":"Version 1","ing":[["Chocolat",125],["Lait",125],["Jaunes",5],["Sucre",150],["Crème",100]],"presets":{"i":2,"v":[1,2,3,4,5]}},{"label":"Version 2","ing":[["Chocolat",150],["Lait",300],["Jaunes",5],["Sucre",60],["Crème",200]],"presets":{"i":2,"v":[1,3,4,5]}}]},{"id":"supra-sable","name":"Supra sablé","note":"180° 12 à 15 min puis 12 min 180°","variants":[{"ing":[["Beurre",280],["Cassonade",170],["Poudre d'amande",150],["Oeuf",1],["Jaune",1],["T55",250],["Sel",null],["#Après cuisson"],["Beurre",80],["Cassonade",80]],"mults":[0.5,1]}]},{"id":"glace-vanille","name":"Glace vanille","variants":[{"ing":[["Lait",0.5,"l"],["Crème liquide",50,"ml"],["Jaunes",4],["Sucre semoule",125],["Vanille",null]]}]},{"id":"straciatella","name":"Straciatella","variants":[{"ing":[["Lait",300],["Crème liquide",200],["Sucre semoule",100],["Vanille",null],["Chocolat noir",80]],"mults":[1,1.25]}]},{"id":"faux-quatre-quarts","name":"Faux quatre quarts","note":"165°C 30 min","variants":[{"ing":[["Oeufs",2],["Sucre",150],["Lait",80],["Beurre fondu",100],["Farine",125],["Levure",5]]}]}];

const I = {
  oven:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 8h18"/><rect x="7" y="11" width="10" height="7" rx="1"/><path d="M7 5.5h.01M10 5.5h.01"/></svg>',
  chev:'<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',

};
const UNITS = ["", "g", "kg", "ml", "cl", "l", "c. à s.", "c. à c."];

/* ---------- mémoire du téléphone ---------- */
function load(key, def){ try{ const v=JSON.parse(localStorage.getItem(key)||"null"); return v&&typeof v==="object"?Object.assign(def,v):def; }catch(e){ return def; } }
function put(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); return true; }catch(e){ return false; } }
let state = load("proportions-v1", {f:{}, v:{}, q:"", draft:null});
let store = load("proportions-recettes-v1", {added:[], overrides:{}, hidden:[], changedAt:0, backupAt:0});
const save = () => put("proportions-v1", state);
function saveStore(){
  store.changedAt = Date.now();
  const ok = put("proportions-recettes-v1", store);
  try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
  return ok;
}

function allRecipes(){
  const out = [];
  for (const b of BUILTIN){
    if (store.hidden.includes(b.id)) continue;
    const o = store.overrides[b.id];
    out.push(Object.assign({}, o || b, {id:b.id, builtin:true, modified:!!o}));
  }
  for (const a of store.added) out.push(Object.assign({}, a, {custom:true}));
  return out;
}
const byId = id => allRecipes().find(r => r.id === id);

/* ---------- utilitaires ---------- */
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
function fmt(x){
  let r;
  if (x >= 10) r = Math.round(x);
  else if (x >= 1) r = Math.round(x*10)/10;
  else r = Math.round(x*100)/100;
  return String(r).replace(".", ",");
}
const raw = x => String(Math.round(x*100)/100).replace(".", ",");
function parseNum(s){
  const n = parseFloat(String(s).replace(",", ".").replace(/[^\d.]/g,""));
  return isFinite(n) && n > 0 ? n : null;
}
const NUM = "(\\d+(?:[.,]\\d+)?)";
function parseQty(s){
  s = String(s||"").trim();
  if (!s) return {ok:true, q:null};
  const m = s.match(new RegExp("^"+NUM+"\\s*(?:à|a|-|–)\\s*"+NUM+"$","i"));
  if (m){ const a=+m[1].replace(",","."), b=+m[2].replace(",","."); if(a>0&&b>a) return {ok:true,q:[a,b]}; }
  const n = s.match(new RegExp("^"+NUM+"$"));
  if (n){ const v=+n[1].replace(",","."); return v>0?{ok:true,q:v}:{ok:true,q:null}; }
  return {ok:false};
}
function parseList(s){
  return String(s||"").replace(/,\s+/g,";").split(/[;\s\/]+/).map(x=>parseNum(x)).filter(x=>x!=null);
}
function fmtFactor(f){
  const map={0.25:"¼",0.5:"½",0.75:"¾"};
  const r=Math.round(f*100)/100;
  return map[r] || String(r).replace(".", ",");
}
const isSec = row => typeof row[0]==="string" && row[0].startsWith("#");
let uidN = 0; const uid = () => "u" + (++uidN) + Math.random().toString(36).slice(2,6);
function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("on"),2600);
}
function dialog({title, text="", body="", actions}){
  const host = document.getElementById("dialog");
  host.innerHTML = `<div class="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dlgT">
    <h2 id="dlgT">${esc(title)}</h2>${text?`<p>${esc(text)}</p>`:""}${body}
    <div class="acts">${actions.map((a,i)=>`<button type="button" class="btn wide ${a.kind||""}" data-a="${i}">${esc(a.label)}</button>`).join("")}</div>
  </div></div>`;
  const close = () => { host.innerHTML = ""; };
  host.querySelector(".scrim").addEventListener("click", e => { if (e.target.classList.contains("scrim")) close(); });
  host.querySelectorAll("[data-a]").forEach(b => b.addEventListener("click", () => { const a = actions[+b.dataset.a]; if (a.keep) { a.fn && a.fn(host); } else { close(); a.fn && a.fn(); } }));
  const first = host.querySelector("textarea, input, [data-a]"); if (first) first.focus();
  return host;
}
const closeDialog = () => { document.getElementById("dialog").innerHTML = ""; };

/* ---------- liste ---------- */
function renderList(){
  document.title = "Mes proportions";
  const app = document.getElementById("app");
  app.className = "wrap has-fab";
  const d = state.draft;
  const dirtyBackup = (store.added.length || Object.keys(store.overrides).length || store.hidden.length) && store.changedAt > store.backupAt;
  app.innerHTML = `
    <header class="top">
      <div class="toprow"><h1>Mes proportions</h1>
        <button type="button" class="round" id="menu" aria-label="Sauvegarde et options">${I.more}</button></div>
      ${d ? `<div class="banner"><span>Recette en cours de saisie : <b>${esc(d.data.name||"sans nom")}</b></span>
        <a href="#${d.target==="new"?"nouvelle-recette":"modifier-"+d.target}">Reprendre</a>
        <button type="button" id="dropDraft">Abandonner</button></div>` : ""}
      <label class="search" for="q">${I.search}
        <input id="q" type="search" placeholder="Recette ou ingrédient (ex. blancs)" autocomplete="off" value="${esc(state.q||"")}">
      </label>
    </header>
    <ul class="list" id="list"></ul>
    <p class="empty" id="empty" hidden>Aucune recette ne correspond.</p>
    ${dirtyBackup ? `<div class="banner" style="margin-top:16px"><span>Vos ajouts ne sont enregistrés que sur ce téléphone.</span><button type="button" id="quickBackup">Sauvegarder</button></div>` : ""}
    <p class="foot" id="count"></p>
    <a class="fab" href="#nouvelle-recette">${I.plus}Nouvelle recette</a>`;
  const q = document.getElementById("q");
  q.addEventListener("input", () => { state.q=q.value; save(); fillList(); });
  document.getElementById("menu").onclick = openMenu;
  const dd = document.getElementById("dropDraft");
  if (dd) dd.onclick = () => dialog({title:"Abandonner la saisie ?", text:"La recette en cours de saisie sera effacée.", actions:[
    {label:"Abandonner", kind:"primary", fn:()=>{ state.draft=null; save(); renderList(); }}, {label:"Garder"}]});
  const qb = document.getElementById("quickBackup"); if (qb) qb.onclick = backup;
  fillList();
}
function fillList(){
  const q = norm(state.q||"").trim();
  const all = allRecipes();
  const items = all.filter(r => {
    if(!q) return true;
    if(norm(r.name).includes(q)) return true;
    return r.variants.some(v => v.ing.some(i => !isSec(i) && norm(i[0]).includes(q)));
  });
  document.getElementById("list").innerHTML = items.map(r => {
    const tag = r.custom ? '<span class="tag">Ajoutée</span>' : r.modified ? '<span class="tag">Modifiée</span>' : "";
    const sub = r.note ? `<span class="s">${I.oven}${esc(r.note.split("\n")[0])}</span>`
      : `<span class="s">${r.variants[0].ing.filter(i=>!isSec(i)).length} ingrédients${r.variants.length>1?` · ${r.variants.length} versions`:""}</span>`;
    return `<li><a href="#${r.id}"><span class="t"><span class="n">${esc(r.name)}${tag}</span>${sub}</span>${I.chev}</a></li>`;
  }).join("");
  document.getElementById("empty").hidden = items.length>0;
  const n = store.added.length;
  document.getElementById("count").textContent = `${all.length} recettes${n?`, dont ${n} ajoutée${n>1?"s":""} sur ce téléphone`:""}.`;
}

/* ---------- sauvegarde ---------- */
function openMenu(){
  const n = store.added.length, m = Object.keys(store.overrides).length, h = store.hidden.length;
  const last = store.backupAt ? new Date(store.backupAt).toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"}) : null;
  const actions = [
    {label:"Sauvegarder mes recettes", kind:"primary", fn:backup},
    {label:"Restaurer une sauvegarde", fn:()=>document.getElementById("importFile").click()}
  ];
  if (h) actions.push({label:`Rétablir les recettes supprimées (${h})`, fn:()=>{ store.hidden=[]; saveStore(); renderList(); toast("Recettes rétablies."); }});
  actions.push({label:"Fermer"});
  dialog({title:"Sauvegarde",
    text:`${n} recette${n>1?"s":""} ajoutée${n>1?"s":""}, ${m} modifiée${m>1?"s":""}${h?`, ${h} supprimée${h>1?"s":""}`:""}. Ces changements sont gardés sur ce téléphone. ${last?`Dernière sauvegarde : ${last}.`:"Aucune sauvegarde pour l'instant."} Le fichier de sauvegarde peut aussi être envoyé à Claude pour intégrer vos recettes à l'appli.`,
    actions});
}
async function backup(){
  const data = JSON.stringify({app:"mes-proportions", v:1, date:new Date().toISOString(), added:store.added, overrides:store.overrides, hidden:store.hidden}, null, 1);
  const name = `mes-proportions-${new Date().toISOString().slice(0,10)}.json`;
  const done = (msg) => { store.backupAt = Date.now(); put("proportions-recettes-v1", store); if (!location.hash.slice(1) || location.hash==="#recettes") renderList(); toast(msg); };
  let file = null;
  try { file = new File([data], name, {type:"text/plain"}); } catch(e){}
  try{
    if (file && navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:"Sauvegarde Mes proportions"});
      done("Sauvegarde envoyée."); return;
    }
  }catch(e){ if (e && e.name === "AbortError") return; }
  try{
    const url = URL.createObjectURL(new Blob([data], {type:"application/json"}));
    const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    done("Fichier enregistré dans vos téléchargements.");
  }catch(e){ toast("La sauvegarde n'a pas pu être créée sur cet appareil."); }
}
function validRecipe(r){
  return r && typeof r.id==="string" && typeof r.name==="string" && Array.isArray(r.variants) && r.variants.length &&
    r.variants.every(v => Array.isArray(v.ing));
}
document.getElementById("importFile").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  try{
    const d = JSON.parse(await f.text());
    if (!d || d.app !== "mes-proportions") throw new Error("format");
    let n = 0;
    for (const r of (d.added||[])) if (validRecipe(r)) { store.added = store.added.filter(x=>x.id!==r.id); store.added.push(r); n++; }
    for (const [id,r] of Object.entries(d.overrides||{})) if (validRecipe(r) && BUILTIN.some(b=>b.id===id)) { store.overrides[id]=r; n++; }
    for (const id of (d.hidden||[])) if (BUILTIN.some(b=>b.id===id) && !store.hidden.includes(id)) store.hidden.push(id);
    saveStore(); store.backupAt = Date.now(); put("proportions-recettes-v1", store);
    renderList(); toast(`${n} recette${n>1?"s":""} restaurée${n>1?"s":""}.`);
  }catch(err){ toast("Ce fichier n'est pas une sauvegarde de Mes proportions."); }
});

/* ---------- fiche recette ---------- */
let wakeLock = null;
function renderRecipe(r){
  document.title = r.name + " · Mes proportions";
  const vi = Math.min(state.v[r.id]||0, r.variants.length-1);
  const v = r.variants[vi];
  const key = r.id+":"+vi;
  let f = state.f[key] || 1;
  const wakeSupported = "wakeLock" in navigator;

  const app = document.getElementById("app");
  app.className = "wrap";
  const seg = r.variants.length>1 ? `<div class="seg" role="group" aria-label="Version">${
    r.variants.map((x,i)=>`<button type="button" data-v="${i}" aria-pressed="${i===vi}">${esc(x.label||("Version "+(i+1)))}</button>`).join("")}</div>` : "";
  let chipsLabel, chips;
  const pIng = v.presets && v.ing[v.presets.i];
  if (pIng && typeof pIng[1]==="number"){
    chipsLabel = pIng[0];
    chips = v.presets.v.map(val=>`<button type="button" class="chip" data-f="${val/pIng[1]}">${fmt(val)}</button>`).join("");
  } else {
    chipsLabel = "Quantité";
    chips = (v.mults||[0.5,1,2]).map(m=>`<button type="button" class="chip" data-f="${m}">×${fmtFactor(m)}</button>`).join("");
  }

  const rows = v.ing.map((row,idx)=>{
    if (isSec(row)) return `<li class="sec"><span class="label">${esc(row[0].slice(1))}</span></li>`;
    const [name,base,unit] = row;
    const u = unit ? `<span class="unit">${esc(unit)}</span>` : "";
    let right;
    if (base==null) right = `<span class="none">à doser</span>`;
    else if (Array.isArray(base)) right = `<span class="static" data-range="${idx}"></span>`;
    else right = `<input class="qty" id="q-${idx}" data-i="${idx}" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" aria-label="${esc(name)}">`;
    const forAttr = (base!=null && !Array.isArray(base)) ? ` for="q-${idx}"` : "";
    return `<li><label class="nm"${forAttr}>${esc(name)}${u}</label>${right}</li>`;
  }).join("");

  app.innerHTML = `
    <div class="bar">
      <a class="back" href="#recettes">${I.back}Recettes</a>
      <span class="spacer"></span>
      ${wakeSupported?`<button type="button" class="iconbtn" id="wake" aria-pressed="${!!wakeLock}">${I.sun}Écran allumé</button>`:""}
      <a class="iconbtn" href="#modifier-${r.id}">${I.pen}Modifier</a>
    </div>
    <section class="head">
      <h1>${esc(r.name)}</h1>
      ${r.note?`<div class="note">${I.oven}<span>${esc(r.note)}</span></div>`:""}
      ${seg}
    </section>
    <section class="panel" aria-label="Ajuster les quantités">
      <span class="label">${esc(chipsLabel)}</span>
      <div class="chips" id="chips">${chips}</div>
      <div class="tools">
        <button type="button" id="half">÷ 2</button>
        <button type="button" id="dbl">× 2</button>
        <button type="button" id="reset" aria-label="Revenir aux quantités de base">Base</button>
        <span class="factor" id="factor"></span>
      </div>
    </section>
    <ul class="ings">${rows}</ul>
    <p class="hint">Touchez une quantité et tapez ce que vous avez : tous les autres ingrédients s'ajustent.</p>`;

  const inputs=[...app.querySelectorAll(".qty")];
  function paint(skip){
    inputs.forEach(inp=>{ if (inp!==skip) inp.value = fmt(v.ing[+inp.dataset.i][1]*f); });
    app.querySelectorAll("[data-range]").forEach(el=>{
      const [a,b]=v.ing[+el.dataset.range][1];
      el.textContent = fmt(a*f)+" à "+fmt(b*f);
    });
    app.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed", Math.abs(+c.dataset.f - f) < 1e-6*Math.max(1,f)));
    document.getElementById("factor").innerHTML = Math.abs(f-1)<1e-9 ? "Base de la recette" : `<b>×${fmtFactor(f)}</b> la base`;
    document.getElementById("reset").disabled = Math.abs(f-1)<1e-9;
    inputs.forEach(i=>i.classList.toggle("edited", Math.abs(f-1)>1e-9));
  }
  function setF(nf, skip){
    f = nf;
    if (Math.abs(f-1)<1e-9) delete state.f[key]; else state.f[key]=f;
    save(); paint(skip);
  }
  inputs.forEach(inp=>{
    inp.addEventListener("focus", ()=>inp.select());
    inp.addEventListener("input", ()=>{ const n=parseNum(inp.value); if (n!=null) setF(n / v.ing[+inp.dataset.i][1], inp); });
    inp.addEventListener("blur", ()=>paint());
    inp.addEventListener("keydown", e=>{ if(e.key==="Enter") inp.blur(); });
  });
  app.querySelectorAll(".chip").forEach(c=>c.addEventListener("click", ()=>setF(+c.dataset.f)));
  document.getElementById("half").onclick = ()=>setF(f/2);
  document.getElementById("dbl").onclick = ()=>setF(f*2);
  document.getElementById("reset").onclick = ()=>setF(1);
  app.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click", ()=>{ state.v[r.id]=+b.dataset.v; save(); renderRecipe(r); }));
  const wake=document.getElementById("wake");
  if (wake) wake.onclick = async ()=>{
    try{
      if (wakeLock){ await wakeLock.release(); wakeLock=null; wake.setAttribute("aria-pressed","false"); toast("L'écran peut de nouveau se mettre en veille."); }
      else {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", ()=>{ wakeLock=null; const w=document.getElementById("wake"); if(w) w.setAttribute("aria-pressed","false"); });
        wake.setAttribute("aria-pressed","true"); toast("L'écran restera allumé pendant que vous cuisinez.");
      }
    }catch(e){ toast("Cette option n'est pas disponible dans ce navigateur."); }
  };
  paint();
  window.scrollTo(0,0);
}

/* ---------- éditeur ---------- */
const DEFAULT_MULTS = "0,5 ; 1 ; 2";
const blankRow = () => ({u:uid(), k:"i", name:"", qty:"", unit:""});
const blankVersion = (label="") => ({label, rows:[blankRow(), blankRow(), blankRow()], ref:"mult", refValues:DEFAULT_MULTS});
function recipeToDraft(r){
  return {name:r.name, note:r.note||"", cur:0, versions:r.variants.map((v,vi)=>{
    const rows = v.ing.map(row => isSec(row) ? {u:uid(), k:"s", name:row[0].slice(1), qty:"", unit:""}
      : {u:uid(), k:"i", name:row[0], qty: row[1]==null ? "" : Array.isArray(row[1]) ? `${raw(row[1][0])} à ${raw(row[1][1])}` : raw(row[1]), unit:row[2]||""});
    let ref="mult", refValues=DEFAULT_MULTS;
    if (v.presets && rows[v.presets.i]) { ref = rows[v.presets.i].u; refValues = v.presets.v.map(raw).join(" ; "); }
    else if (v.mults) refValues = v.mults.map(raw).join(" ; ");
    return {label: v.label || (r.variants.length>1 ? "Version "+(vi+1) : ""), rows, ref, refValues};
  })};
}
function draftToRecipe(d){
  const errors = [];
  const name = d.name.trim();
  if (!name) errors.push("Donnez un nom à la recette.");
  const variants = d.versions.map((ver, vi) => {
    const vname = d.versions.length>1 ? (ver.label.trim() || "Version "+(vi+1)) : "";
    const ing = []; let presetIndex = null;
    for (const row of ver.rows){
      const n = row.name.trim();
      if (!n) { if (row.k==="i" && row.qty.trim()) errors.push(`${vname?vname+" : ":""}une quantité (${row.qty.trim()}) n'a pas d'ingrédient.`); continue; }
      if (row.k === "s") { ing.push(["#"+n]); continue; }
      const p = parseQty(row.qty);
      if (!p.ok) { errors.push(`Quantité non comprise pour « ${n} » : écrivez un nombre (150, 0,5) ou une fourchette (40 à 80).`); continue; }
      if (row.u === ver.ref) presetIndex = ing.length;
      ing.push(row.unit ? [n, p.q, row.unit] : [n, p.q]);
    }
    if (!ing.some(x=>!isSec(x))) errors.push(`${vname?vname+" : ":""}ajoutez au moins un ingrédient.`);
    const v = {}; if (vname) v.label = vname; v.ing = ing;
    const vals = parseList(ver.refValues);
    if (ver.ref === "mult") {
      if (vals.length && ver.refValues.replace(/\s/g,"") !== DEFAULT_MULTS.replace(/\s/g,"")) v.mults = vals;
    } else if (presetIndex != null) {
      if (typeof ing[presetIndex][1] !== "number") errors.push(`Les raccourcis portent sur « ${ing[presetIndex][0]} », qui doit avoir une quantité simple.`);
      else if (vals.length) v.presets = {i:presetIndex, v:vals};
    }
    return v;
  });
  const r = {name, variants};
  if (d.note.trim()) r.note = d.note.trim();
  return {errors, recipe:r};
}
function slugify(name){
  let s = norm(name).replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40) || "recette";
  if (["recettes","nouvelle-recette","settings","sidebar","customize","upgrade","downloads"].includes(s) || /^(comment|modifier)-/.test(s)) s = "r-"+s;
  const taken = new Set([...BUILTIN.map(b=>b.id), ...store.added.map(a=>a.id)]);
  let id = s, n = 2; while (taken.has(id)) id = s+"-"+(n++);
  return id;
}

let ed = null; // {target, draft, errors}
function renderEditor(target){
  const existing = target === "new" ? null : byId(target);
  if (target !== "new" && !existing) { location.hash = "#recettes"; return; }
  let restored = false;
  if (!ed || ed.target !== target) {
    if (state.draft && state.draft.target === target) { ed = {target, draft: state.draft.data, errors:[]}; restored = true; }
    else ed = {target, draft: existing ? recipeToDraft(existing) : {name:"", note:"", cur:0, versions:[blankVersion()]}, errors:[], pristine:true};
  }
  document.title = (existing ? "Modifier " + existing.name : "Nouvelle recette") + " · Mes proportions";
  const app = document.getElementById("app");
  app.className = "wrap";
  app.innerHTML = `
    <div class="bar">
      <button type="button" class="back" id="cancel">Annuler</button>
      <span class="ttl">${existing ? "Modifier" : "Nouvelle recette"}</span>
      <button type="button" class="btn primary" id="saveTop" style="min-height:40px">Enregistrer</button>
    </div>
    <form class="form" id="form" novalidate>
      <div class="errors" id="errors" hidden></div>
      <div class="field">
        <label for="fName">Nom de la recette</label>
        <input class="input big" id="fName" type="text" autocomplete="off" enterkeyhint="next" placeholder="ex. Tarte au citron" value="${esc(ed.draft.name)}">
      </div>
      <div class="field">
        <label for="fNote">Cuisson ou remarque <span class="help" style="display:inline">(facultatif)</span></label>
        <textarea class="area" id="fNote" rows="2" placeholder="ex. 180° 25 min">${esc(ed.draft.note)}</textarea>
      </div>
      <div id="verZone"></div>
      ${existing ? `<div class="dz">
        ${existing.modified ? `<button type="button" class="btn wide" id="restore">Rétablir la recette d'origine</button>` : ""}
        <button type="button" class="btn wide danger" id="delete">Supprimer la recette</button></div>` : ""}
      <button type="submit" class="btn primary wide">Enregistrer la recette</button>
    </form>`;
  const d = ed.draft;
  const fName = document.getElementById("fName"), fNote = document.getElementById("fNote");
  fName.addEventListener("input", ()=>{ d.name = fName.value; touch(); });
  fName.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); fNote.focus(); } });
  fNote.addEventListener("input", ()=>{ d.note = fNote.value; touch(); });
  document.getElementById("form").addEventListener("submit", e=>{ e.preventDefault(); commit(); });
  document.getElementById("saveTop").onclick = commit;
  document.getElementById("cancel").onclick = cancelEdit;
  const del = document.getElementById("delete");
  if (del) del.onclick = () => dialog({title:`Supprimer « ${existing.name} » ?`,
    text: existing.builtin ? "Elle disparaîtra de la liste. Vous pourrez la rétablir depuis le menu Sauvegarde." : "La recette sera effacée de ce téléphone.",
    actions:[{label:"Supprimer", kind:"primary", fn:()=>{
      if (existing.builtin){ delete store.overrides[existing.id]; if(!store.hidden.includes(existing.id)) store.hidden.push(existing.id); }
      else store.added = store.added.filter(a=>a.id!==existing.id);
      saveStore(); clearRecipeState(existing.id); state.draft=null; save(); ed=null;
      location.hash = "#recettes"; toast("Recette supprimée.");
    }},{label:"Garder la recette"}]});
  const rs = document.getElementById("restore");
  if (rs) rs.onclick = () => dialog({title:"Rétablir la recette d'origine ?", text:"Vos modifications de cette recette seront effacées.",
    actions:[{label:"Rétablir", kind:"primary", fn:()=>{ delete store.overrides[existing.id]; saveStore(); clearRecipeState(existing.id); state.draft=null; save(); ed=null; location.hash = "#"+existing.id; toast("Recette d'origine rétablie."); }},{label:"Annuler"}]});
  renderVersions();
  showErrors();
  window.scrollTo(0,0);
  if (restored) toast("Saisie en cours reprise.");
  else if (!existing) fName.focus();
}
function touch(){ ed.pristine = false; state.draft = {target: ed.target, data: ed.draft, at: Date.now()}; save(); }
function clearRecipeState(id){ Object.keys(state.f).forEach(k=>{ if(k.startsWith(id+":")) delete state.f[k]; }); delete state.v[id]; }
function cancelEdit(){
  const leave = () => { state.draft = null; save(); const t = ed.target; ed = null; location.hash = t==="new" ? "#recettes" : "#"+t; };
  if (ed.pristine && !(state.draft && state.draft.target===ed.target)) return leave();
  dialog({title:"Quitter sans enregistrer ?", text:"Ce que vous avez saisi sera perdu.", actions:[
    {label:"Continuer la saisie", kind:"primary"}, {label:"Quitter sans enregistrer", kind:"danger", fn:leave}]});
}
function commit(){
  const {errors, recipe} = draftToRecipe(ed.draft);
  ed.errors = errors;
  if (errors.length) { showErrors(); document.getElementById("errors").scrollIntoView({block:"center"}); return; }
  let id = ed.target;
  if (id === "new") { id = slugify(recipe.name); store.added.push(Object.assign({id}, recipe)); }
  else if (BUILTIN.some(b=>b.id===id)) store.overrides[id] = Object.assign({id}, recipe);
  else store.added = store.added.map(a => a.id===id ? Object.assign({id}, recipe) : a);
  if (!saveStore()) { ed.errors = ["L'enregistrement a échoué : la mémoire du navigateur est pleine ou désactivée."]; showErrors(); return; }
  clearRecipeState(id); state.draft = null; save(); ed = null;
  location.hash = "#" + id; toast("Recette enregistrée.");
}
function showErrors(){
  const el = document.getElementById("errors");
  if (!el) return;
  el.hidden = !ed.errors.length;
  el.innerHTML = ed.errors.map(e=>`<p>${esc(e)}</p>`).join("");
}
function renderVersions(focusU){
  const d = ed.draft; if (d.cur >= d.versions.length) d.cur = 0;
  const ver = d.versions[d.cur];
  const multi = d.versions.length > 1;
  const zone = document.getElementById("verZone");
  zone.innerHTML = `
    ${multi ? `<div class="vbar">
      <div class="seg" role="group" aria-label="Versions">${d.versions.map((x,i)=>`<button type="button" data-cur="${i}" aria-pressed="${i===d.cur}">${esc(x.label||"Version "+(i+1))}</button>`).join("")}</div>
      <div class="field"><label for="fVer">Nom de cette version</label>
        <div style="display:flex;gap:8px"><input class="input" id="fVer" type="text" autocomplete="off" value="${esc(ver.label)}" placeholder="ex. Version légère">
        <button type="button" class="mini del" id="delVer" aria-label="Supprimer cette version">${I.x}</button></div></div>
    </div>` : ""}
    <div class="field">
      <span class="label-like">Ingrédients</span>
      <p class="help">Quantités pour une fournée de base. Laissez vide si c'est à doser, écrivez « 40 à 80 » pour une fourchette.</p>
    </div>
    <div class="rows" id="rows"></div>
    <div class="addbar">
      <button type="button" class="btn" id="addRow">${I.plus}Ingrédient</button>
      <button type="button" class="btn" id="addSec">${I.plus}Section</button>
      <button type="button" class="btn" id="paste">Coller une liste</button>
    </div>
    <details class="box" id="refBox"${ver.ref!=="mult"||ver.refValues.replace(/\s/g,"")!==DEFAULT_MULTS.replace(/\s/g,"")?" open":""}>
      <summary>Raccourcis de quantité</summary>
      <div class="in">
        <p class="help">Les boutons affichés en haut de la fiche. Par exemple « Jaunes : 1 ; 2 ; 3 ; 4 », ou des multiplicateurs.</p>
        <div class="field"><label for="fRef">Raccourcis sur</label><select class="select" id="fRef"></select></div>
        <div class="field"><label for="fRefV">Valeurs, séparées par des points-virgules</label>
          <input class="input" id="fRefV" type="text" inputmode="decimal" autocomplete="off" value="${esc(ver.refValues)}" placeholder="ex. 1 ; 2 ; 3 ; 4"></div>
      </div>
    </details>
    <button type="button" class="btn ghost" id="addVer" style="justify-self:start">${I.plus}Ajouter une autre version de la recette</button>`;
  zone.style.display = "grid"; zone.style.gap = "14px";

  zone.querySelectorAll("[data-cur]").forEach(b=>b.onclick=()=>{ d.cur=+b.dataset.cur; touch(); renderVersions(); });
  const fVer = document.getElementById("fVer");
  if (fVer) fVer.addEventListener("input", ()=>{ ver.label=fVer.value; touch(); const b=zone.querySelector(`[data-cur="${d.cur}"]`); if(b) b.textContent = ver.label || "Version "+(d.cur+1); });
  const delVer = document.getElementById("delVer");
  if (delVer) delVer.onclick = ()=>dialog({title:`Supprimer « ${ver.label||"Version "+(d.cur+1)} » ?`, text:"Les ingrédients de cette version seront effacés.", actions:[
    {label:"Supprimer la version", kind:"primary", fn:()=>{ d.versions.splice(d.cur,1); d.cur=0; touch(); renderVersions(); }},{label:"Annuler"}]});
  document.getElementById("addRow").onclick = ()=>{ const r=blankRow(); ver.rows.push(r); touch(); renderRows(r.u); };
  document.getElementById("addSec").onclick = ()=>{ const r={u:uid(),k:"s",name:"",qty:"",unit:""}; ver.rows.push(r); touch(); renderRows(r.u); };
  document.getElementById("paste").onclick = openPaste;
  document.getElementById("addVer").onclick = ()=>{
    if (d.versions.length===1 && !d.versions[0].label) d.versions[0].label = "Version 1";
    const nv = JSON.parse(JSON.stringify(ver)); nv.label = "Version " + (d.versions.length+1);
    nv.rows.forEach(r=>{ const old=r.u; r.u=uid(); if (nv.ref===old) nv.ref=r.u; });
    d.versions.push(nv); d.cur = d.versions.length-1; touch(); renderVersions();
    toast("Nouvelle version créée à partir de la précédente.");
  };
  const fRef = document.getElementById("fRef"), fRefV = document.getElementById("fRefV");
  fRef.addEventListener("change", ()=>{
    const was = ver.ref; ver.ref = fRef.value;
    if (ver.ref==="mult" && was!=="mult") ver.refValues = DEFAULT_MULTS;
    else if (ver.ref!=="mult" && (was==="mult" || !ver.refValues.trim())) {
      const row = ver.rows.find(r=>r.u===ver.ref); const b = row && parseQty(row.qty);
      ver.refValues = (b && typeof b.q==="number") ? [0.5,1,2].map(m=>raw(b.q*m)).join(" ; ") : "";
    }
    fRefV.value = ver.refValues; touch();
  });
  fRefV.addEventListener("input", ()=>{ ver.refValues = fRefV.value; touch(); });
  renderRows(focusU);
}
function fillRefSelect(){
  const ver = ed.draft.versions[ed.draft.cur];
  const sel = document.getElementById("fRef"); if (!sel) return;
  const opts = [`<option value="mult">Multiplicateurs (×½, ×1, ×2…)</option>`]
    .concat(ver.rows.filter(r=>r.k==="i" && r.name.trim()).map(r=>`<option value="${r.u}">${esc(r.name.trim())}</option>`));
  if (ver.ref!=="mult" && !ver.rows.some(r=>r.u===ver.ref && r.k==="i" && r.name.trim())) { ver.ref="mult"; }
  sel.innerHTML = opts.join(""); sel.value = ver.ref;
}
function renderRows(focusU){
  const ver = ed.draft.versions[ed.draft.cur];
  const host = document.getElementById("rows");
  const n = ver.rows.length;
  host.innerHTML = ver.rows.map((r,i)=> r.k==="s" ? `
    <div class="row secrow" data-u="${r.u}">
      <div class="l1"><input class="input nameI" type="text" autocomplete="off" enterkeyhint="next" placeholder="Titre de section (ex. Après cuisson)" value="${esc(r.name)}" aria-label="Titre de section">
        <button type="button" class="mini" data-mv="-1" aria-label="Monter"${i===0?" disabled":""}>${I.up}</button>
        <button type="button" class="mini" data-mv="1" aria-label="Descendre"${i===n-1?" disabled":""}>${I.down}</button>
        <button type="button" class="mini del" data-del aria-label="Supprimer la section">${I.x}</button></div>
    </div>` : `
    <div class="row" data-u="${r.u}">
      <div class="l1"><input class="input nameI" type="text" autocomplete="off" autocapitalize="sentences" enterkeyhint="next" placeholder="Ingrédient" value="${esc(r.name)}" aria-label="Ingrédient ${i+1}">
        <button type="button" class="mini del" data-del aria-label="Supprimer cet ingrédient">${I.x}</button></div>
      <div class="l2"><input class="input qtyI" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="next" placeholder="Quantité" value="${esc(r.qty)}" aria-label="Quantité de l'ingrédient ${i+1}">
        <select class="select unitS" aria-label="Unité">${UNITS.map(u=>`<option value="${esc(u)}"${u===r.unit?" selected":""}>${u||"—"}</option>`).join("")}</select>
        <button type="button" class="mini" data-mv="-1" aria-label="Monter"${i===0?" disabled":""}>${I.up}</button>
        <button type="button" class="mini" data-mv="1" aria-label="Descendre"${i===n-1?" disabled":""}>${I.down}</button></div>
    </div>`).join("");
  host.querySelectorAll(".row").forEach(el=>{
    const r = ver.rows.find(x=>x.u===el.dataset.u);
    const nameI = el.querySelector(".nameI"), qtyI = el.querySelector(".qtyI"), unitS = el.querySelector(".unitS");
    nameI.addEventListener("input", ()=>{ r.name = nameI.value; touch(); });
    nameI.addEventListener("change", fillRefSelect);
    nameI.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); if (qtyI) qtyI.focus(); else nextRow(r); } });
    if (qtyI){
      qtyI.addEventListener("input", ()=>{ r.qty = qtyI.value; touch(); });
      qtyI.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); nextRow(r); } });
    }
    if (unitS) unitS.addEventListener("change", ()=>{ r.unit = unitS.value; touch(); });
    el.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>{
      const i = ver.rows.indexOf(r), j = i + (+b.dataset.mv);
      if (j<0 || j>=ver.rows.length) return;
      [ver.rows[i], ver.rows[j]] = [ver.rows[j], ver.rows[i]]; touch(); renderRows();
      const moved = document.querySelector(`.row[data-u="${r.u}"] [data-mv="${b.dataset.mv}"]`) || document.querySelector(`.row[data-u="${r.u}"] [data-mv]:not([disabled])`);
      if (moved) moved.focus();
    });
    el.querySelector("[data-del]").onclick = ()=>{
      ver.rows = ver.rows.filter(x=>x!==r); touch(); renderRows();
      if (r.name.trim()) toast(`« ${r.name.trim()} » retiré.`);
    };
  });
  fillRefSelect();
  if (focusU){ const f = document.querySelector(`.row[data-u="${focusU}"] .nameI`); if (f){ f.focus(); f.scrollIntoView({block:"center"}); } }
}
function nextRow(r){
  const ver = ed.draft.versions[ed.draft.cur];
  const i = ver.rows.indexOf(r);
  const nx = ver.rows[i+1];
  if (nx) { const f = document.querySelector(`.row[data-u="${nx.u}"] .nameI`); if (f) f.focus(); }
  else { const n = blankRow(); ver.rows.push(n); touch(); renderRows(n.u); }
}
function parseLine(line){
  let s = line.replace(/^[\s\-•*·]+/,"").trim();
  if (!s) return null;
  const U = "(kg|g|gr|grammes?|ml|cl|l|litres?|c\\.?\\s?à\\s?s\\.?|c\\.?\\s?à\\s?c\\.?|cas|cac)";
  const normU = u => { if(!u) return ""; u=norm(u).replace(/\s/g,""); if(/^(g|gr|grammes?)$/.test(u)) return "g"; if(/^(l|litres?)$/.test(u)) return "l";
    if(/^(c\.?as\.?|cas)$/.test(u)) return "c. à s."; if(/^(c\.?ac\.?|cac)$/.test(u)) return "c. à c."; return u; };
  const Q = NUM+"(?:\\s*(?:à|-|–)\\s*"+NUM+")?";
  let m = s.match(new RegExp("^(.*?)[\\s:=]+"+Q+"\\s*"+U+"?\\.?$","i"));
  if (m && m[1].trim()) return {name:m[1].replace(/[:=]\s*$/,"").trim(), qty: m[3] ? `${m[2]} à ${m[3]}` : m[2], unit: normU(m[4])};
  m = s.match(new RegExp("^"+Q+"\\s*"+U+"?\\s+(?:de\\s+|d['’]\\s*)?(.+)$","i"));
  if (m) return {name:m[4].trim(), qty: m[2] ? `${m[1]} à ${m[2]}` : m[1], unit: normU(m[3])};
  return {name:s, qty:"", unit:""};
}
function openPaste(){
  dialog({title:"Coller une liste d'ingrédients",
    text:"Un ingrédient par ligne. Les quantités et unités sont reconnues : « Sucre 150 », « 200 g de farine », « Crème 40 à 80 ».",
    body:`<textarea class="area" id="pasteT" rows="8" placeholder="Farine 250&#10;Beurre 125 g&#10;2 oeufs&#10;Sel"></textarea>`,
    actions:[{label:"Ajouter ces ingrédients", kind:"primary", keep:true, fn:(host)=>{
      const lines = host.querySelector("#pasteT").value.split(/\n/).map(parseLine).filter(Boolean);
      if (!lines.length) { toast("Aucun ingrédient trouvé dans le texte."); return; }
      const ver = ed.draft.versions[ed.draft.cur];
      ver.rows = ver.rows.filter(r=>r.name.trim()||r.qty.trim());
      lines.forEach(l=>{ if (!UNITS.includes(l.unit)) l.unit=""; ver.rows.push({u:uid(), k:"i", name:l.name.charAt(0).toUpperCase()+l.name.slice(1), qty:l.qty, unit:l.unit}); });
      closeDialog(); touch(); renderRows();
      toast(`${lines.length} ingrédient${lines.length>1?"s":""} ajouté${lines.length>1?"s":""}. Vérifiez les quantités.`);
    }},{label:"Annuler"}]});
}

/* ---------- navigation ---------- */
function route(){
  closeDialog();
  const h = decodeURIComponent(location.hash.slice(1));
  if (h === "nouvelle-recette") return renderEditor("new");
  if (h.startsWith("modifier-")) return renderEditor(h.slice(9));
  ed = null;
  const r = byId(h);
  if (r) renderRecipe(r); else renderList();
}
window.addEventListener("hashchange", route);
route();
if ("serviceWorker" in navigator && window.isSecureContext) { navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
</body>
